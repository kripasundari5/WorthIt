services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradeoff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradeoff"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/tradeoff
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      FLOOR_PERCENTILE: ${FLOOR_PERCENTILE:-35}
      FLOOR_LAMBDA: ${FLOOR_LAMBDA:-3.0}
      PRIORITY_GAMMA: ${PRIORITY_GAMMA:-0.7}
      MIN_MENTIONS: ${MIN_MENTIONS:-1}
      USE_PRICE_EFFICIENCY: ${USE_PRICE_EFFICIENCY:-1}
      PRICE_WEIGHT: ${PRICE_WEIGHT:-0.20}
      FLOOR_GUARD: ${FLOOR_GUARD:-0}
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      DB_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/tradeoff
      FLOOR_PERCENTILE: ${FLOOR_PERCENTILE:-35}
      FLOOR_LAMBDA: ${FLOOR_LAMBDA:-3.0}
      PRIORITY_GAMMA: ${PRIORITY_GAMMA:-0.7}
      MIN_MENTIONS: ${MIN_MENTIONS:-1}
      USE_PRICE_EFFICIENCY: ${USE_PRICE_EFFICIENCY:-1}
      PRICE_WEIGHT: ${PRICE_WEIGHT:-0.20}
      FLOOR_GUARD: ${FLOOR_GUARD:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
